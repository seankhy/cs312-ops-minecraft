apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft
  labels:
    app: minecraft
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minecraft
  template:
    metadata:
      labels:
        app: minecraft
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: minecraft
          image: 627060426125.dkr.ecr.us-east-1.amazonaws.com/cs312-minecraft:v1.0.1
          envFrom:
            - configMapRef:
                name: minecraft-config
          ports:
            - containerPort: 25565
          startupProbe:
            tcpSocket:
              port: 25565
            failureThreshold: 60
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 25565
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 25565
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          volumeMounts:
            - name: world-data
              mountPath: /data
        - name: mc-monitor
          image: itzg/mc-monitor
          args:
            - "export-for-prometheus"
            - "-servers=localhost:25565"
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "50m"
      volumes:
        - name: world-data
          persistentVolumeClaim:
            claimName: minecraft-world-pvc
